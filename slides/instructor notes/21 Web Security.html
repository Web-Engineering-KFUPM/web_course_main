<h1 id="what-is-a-third-party-web-api">What is a Third-Party Web API?</h1>
<p><strong>API</strong> = Application Programming Interface</p>
<p>A <strong>third-party web API</strong> is a service provided by another company that your application can use</p>
<p><strong>Key idea:</strong></p>
<ul>
<li>You don't need to build everything yourself</li>
<li>Use existing services to add features to your app</li>
<li>Access data and services over the internet</li>
</ul>

<h1 id="how-third-party-apis-work">How Third-Party APIs Work</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Your Application → HTTP Request → Third-Party API Server
                                    ↓
Your Application ← HTTP Response ← Third-Party API Server
</code></pre>
<p><strong>Flow:</strong></p>
<ol>
<li>Your app sends a request to the API</li>
<li>API processes the request</li>
<li>API sends back data (usually JSON)</li>
<li>Your app uses the data</li>
</ol>

<h1 id="url-encoding">URL Encoding</h1>
<p><strong>Why encode URLs?</strong></p>
<ul>
<li>City names may contain special characters</li>
<li>Spaces, Arabic characters, etc. need encoding</li>
</ul>
<p><strong>How to encode:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> city = <span class="hljs-string">&quot;New York&quot;</span>;
<span class="hljs-keyword">const</span> encoded = <span class="hljs-built_in">encodeURIComponent</span>(city);
<span class="hljs-comment">// Result: &quot;New%20York&quot;</span>

<span class="hljs-keyword">const</span> url = <span class="hljs-string">`https://api.example.com/weather/<span class="hljs-subst">${encoded}</span>`</span>;
</code></pre>
<p><strong>Always encode user input in URLs!</strong></p>

<p><strong>Authentication</strong> = Verifying who a user is</p>
<p><strong>Why we need it:</strong></p>
<ul>
<li>Protect sensitive resources</li>

<li>Personalize user experience</li>
</ul>

<ul>
<li>Only logged-in users can view their profile</li>
<li>Only authenticated users can access protected routes</li>
</ul>

<h1 id="authentication-methods">Authentication Methods</h1>
<p><strong>Common authentication approaches:</strong></p>
<div class="two-column-slide">
<div class="column-left">
<p><strong>1. Session-Based Authentication:</strong></p>
<ul>
<li>Server creates session after login</li>
<li>Session ID stored in cookie</li>
<li>Server maintains session state</li>
<li>Traditional approach, widely used</li>
</ul>
</div>
<div class="column-right">
<p><strong>2. Token-Based Authentication:</strong></p>
<ul>
<li>Server creates token after login</li>
<li>Token sent with each request</li>
<li>Server doesn't store session state</li>
<li>Modern approach, scalable</li>
</ul>
</div>
</div>
<footer>SWE 363 | 252 | KFUPM</footer>
</section>

<h1 id="traditional-authentication-problem">Traditional Authentication Problem</h1>
<p><strong>Session-based authentication:</strong></p>
<ul>
<li>Server stores session information</li>
<li>Requires server to remember each user</li>
<li>Difficult to scale across multiple servers</li>
<li>Server must maintain session state</li>
</ul>
<p><strong>Problem:</strong></p>
<ul>
<li>What if you have multiple servers?</li>
<li>What if server restarts?</li>
<li>How to share sessions across servers?</li>
</ul>

<h1 id="token-based-authentication">Token-Based Authentication</h1>
<p><strong>Solution: Token-based authentication</strong></p>
<p><strong>How it works:</strong></p>
<ol>
<li>User logs in with credentials</li>
<li>Server verifies credentials</li>
<li>Server creates a token and sends it to client</li>
<li>Client sends token with each request</li>
<li>Server verifies token to authenticate user</li>
</ol>
<p><strong>Key advantage:</strong> Stateless - server doesn't store session data</p>
<footer>SWE 363 | 252 | KFUPM</footer>
</section>

<h1 id="jwt-structure-three-parts">JWT Structure (<strong>Three parts</strong>)</h1>
<p><strong>1. Header:</strong></p>
<ul>
<li>Describes the token type and encryption method</li>
<li>Example: <code>{&quot;alg&quot;: &quot;HS256&quot;, &quot;typ&quot;: &quot;JWT&quot;}</code></li>
</ul>
<p><strong>2. Payload:</strong></p>
<ul>
<li>Contains user information (claims)</li>
<li>Example: <code>{&quot;email&quot;: &quot;user@example.com&quot;, &quot;exp&quot;: 1234567890}</code></li>
</ul>
<p><strong>3. Signature:</strong></p>
<ul>
<li>Verifies token authenticity</li>
<li>Created using secret key</li>
</ul>

<h1 id="jwt-advantages">JWT Advantages</h1>
<div class="two-column-slide">
<div class="column-left">
<p><strong>Stateless:</strong></p>
<ul>
<li>No session storage needed</li>
<li>Server doesn't need to remember users</li>
</ul>
<p><strong>Scalable:</strong></p>
<ul>
<li>Works across multiple servers</li>
<li>No shared session storage required</li>
</ul>
</div>
<div class="column-right">
<p><strong>Compact:</strong></p>
<ul>
<li>Small size, easy to send in HTTP headers</li>
<li>Can be stored in cookies</li>
</ul>
<p><strong>Secure:</strong></p>
<ul>
<li>Digitally signed</li>
<li>Can expire automatically</li>
</ul>
</div>
</div>

<h1 id="why-hash-passwords">Why Hash Passwords?</h1>
<p><strong>NEVER store passwords in plain text!</strong></p>
<p><strong>If database is compromised:</strong></p>
<ul>
<li>Plain text: Attackers can read all passwords immediately</li>
<li>Hashed: Attackers see random strings, not actual passwords</li>
</ul>
<p><strong>Real-world example:</strong></p>
<ul>
<li>Many companies have been hacked</li>
<li>If passwords were hashed, damage is limited</li>
<li>If passwords were plain text, all accounts are compromised</li>
</ul>

<h1 id="what-is-password-hashing">What is Password Hashing?</h1>
<p><strong>Hashing</strong> = Converting password into a fixed-length string</p>
<p><strong>Properties:</strong></p>
<ul>
<li><strong>One-way:</strong> Cannot reverse hash to get original password</li>
<li><strong>Deterministic:</strong> Same password always produces same hash</li>
<li><strong>Unique:</strong> Different passwords produce different hashes</li>
</ul>
<p><strong>Example:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Password: &quot;mypassword123&quot;
Hash:     &quot;$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy&quot;
</code></pre>
<footer>SWE 363 | 252 | KFUPM</footer>

<h1 id="hash-functions">Hash Functions</h1>
<p><strong>Simple hash (NOT secure for passwords):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// MD5, SHA-1 - Fast but insecure</span>
<span class="hljs-comment">// Can be cracked quickly with rainbow tables</span>
</code></pre>
<p><strong>Secure hash for passwords:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// bcrypt - Slow by design, secure</span>
<span class="hljs-comment">// Designed specifically for password hashing</span>
</code></pre>
<p><strong>Why slow is good:</strong></p>
<ul>
<li>Makes brute force attacks impractical</li>
<li>Each attempt takes time  and attackers cannot quickly try many passwords</li>
</ul>
<footer>SWE 363 | 252 | KFUPM</footer>
</section>

<h1 id="what-is-salt">What is Salt?</h1>
<p><strong>Salt</strong> = Random data added to password before hashing</p>
<p><strong>Why salt is important:</strong></p>
<ul>
<li>Same password produces different hashes</li>
<li>Prevents rainbow table attacks</li>
<li>Makes each hash unique</li>
</ul>
<p><strong>Example:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Password: &quot;password123&quot;
Salt:     &quot;randomSalt123&quot;
Hash:     hash(password + salt)
</code></pre>
<footer>SWE 363 | 252 | KFUPM</footer>
</section>

<h1 id="hashing-passwords-with-bcrypt">Hashing Passwords with bcrypt</h1>
<p><strong>During user registration:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> password = req.<span class="hljs-property">body</span>.<span class="hljs-property">password</span>;
<span class="hljs-keyword">const</span> saltRounds = <span class="hljs-number">10</span>;  <span class="hljs-comment">// Cost factor (higher = slower but more secure)</span>

<span class="hljs-keyword">const</span> hash = <span class="hljs-keyword">await</span> bcrypt.<span class="hljs-title function_">hash</span>(password, saltRounds);

<span class="hljs-comment">// Store hash in database</span>
users.<span class="hljs-title function_">push</span>({
  <span class="hljs-attr">email</span>: email,
  <span class="hljs-attr">passwordHash</span>: hash  <span class="hljs-comment">// Store hash, NOT plain password!</span>
});
</code></pre>
<p><strong>Important:</strong> Never store the original password!</p>

<h1 id="bcryptcompare-function">bcrypt.compare() Function</h1>
<p><strong>How it works:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">bcrypt.<span class="hljs-title function_">compare</span>(plainPassword, hashedPassword)
</code></pre>
<p><strong>Process:</strong></p>
<ol>
<li>Takes plain password from user</li>
<li>Takes stored hash from database</li>
<li>Hashes plain password with same salt</li>
<li>Compares the two hashes</li>
<li>Returns <code>true</code> if they match, <code>false</code> otherwise</li>
</ol>
<p><strong>You don't need to extract salt manually!</strong></p>

<h1 id="password-security-best-practices">Password Security Best Practices</h1>
<p><strong>1. Always hash passwords:</strong> Never store plain text passwords</p>
<p><strong>2. Use strong hashing:</strong> Use bcrypt or similar (not MD5, SHA-1)</p>
<p><strong>3. Use appropriate cost factor:</strong></p>
<ul>
<li>Balance between security and performance</li>
<li>Typically 10-12 rounds</li>
</ul>
<p><strong>4. Validate password strength:</strong></p>
<ul>
<li>Minimum length</li>
<li>Require special characters</li>
<li>Check against common passwords</li>
</ul>

<p><strong>1. Password Hashing:</strong> Protects passwords if database is compromised. Use bcrypt with salt.</p>

<ul>
<li>Only authenticated users can access</li>
<li>Token must be valid and not expired</li>

<h1 id="common-mistakes-to-avoid">Common Mistakes to Avoid</h1>
<div class="two-column-slide">
<div class="column-left">
<p><strong>Password mistakes:</strong></p>
<ul>
<li>Storing plain text passwords</li>
<li>Using weak hashing (MD5, SHA-1)</li>
<li>Not using salt</li>
<li>Storing salt separately from hash</li>
</ul>
</div>
<div class="column-right">
<p><strong>Token mistakes:</strong></p>
<ul>
<li>Not checking token expiration</li>
<li>Using weak secret keys</li>
<li>Not validating token on every request</li>
<li>Storing tokens insecurely on client</li>
</ul>
